# ==============================================================================
# RIT SAAS — CONFIGURAÇÃO NGINX PARA HOST VPS (REVERSE PROXY + SSL CERTBOT)
# ==============================================================================
# Arquivo: /etc/nginx/sites-available/rit.conf
#
# COMO INSTALAR NA VPS:
# 1. Copie este arquivo para o Nginx da sua VPS:
#      sudo cp deploy/nginx-vps.conf /etc/nginx/sites-available/rit.conf
#
# 2. Ative o site:
#      sudo ln -s /etc/nginx/sites-available/rit.conf /etc/nginx/sites-enabled/
#      sudo nginx -t
#
# 3. Emita os certificados SSL gratuitos com o Certbot:
#      sudo certbot --nginx -d treinerit.com.br -d www.treinerit.com.br -d app.treinerit.com.br -d painel.treinerit.com.br
#
#    (Se você for usar subdomínios de academias como academiaX.treinerit.com.br, emita
#     um certificado wildcard via DNS: sudo certbot certonly --manual --preferred-challenges dns -d treinerit.com.br -d "*.treinerit.com.br")
#
# 4. Recarregue o Nginx:
#      sudo systemctl reload nginx
# ==============================================================================

# --- 1. APP DOS ALUNOS & PWA (app.treinerit.com.br e subdomínios multi-tenant) ---
server {
    # Inclua *.treinerit.com.br quando utilizar subdomínios white-label com certificado wildcard:
    server_name app.treinerit.com.br;

    listen 80;
    # (Após rodar o certbot, ele adicionará automaticamente as linhas listen 443 ssl)

    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 50m; # Permite upload de vídeos e fotos de execução dos exercícios

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Suporte completo a WebSockets e Server-Sent Events (notificações em tempo real)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Headers de encaminhamento de IP real do aluno (essencial para rate-limiting seguro)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# --- 2. PAINEL DE GESTÃO B2B & SUPER ADMIN (painel.treinerit.com.br) ---
server {
    server_name painel.treinerit.com.br gestao.treinerit.com.br;

    listen 80;
    # (Após rodar o certbot, ele adicionará automaticamente as linhas listen 443 ssl)

    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        # Suporte a WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# --- 3. DOMÍNIO RAIZ INSTITUCIONAL / LANDING PAGE (treinerit.com.br & www.treinerit.com.br) ---
server {
    server_name treinerit.com.br www.treinerit.com.br;

    listen 80;

    location / {
        # Encaminha para a vitrine/landing institucional do portal (portal redireciona www -> treinerit.com.br 301):
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

