name: Android APK (Rit)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Tipo de build do APK
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
      api_base:
        description: URL base da API do Rit Painel no APK
        required: false
        default: https://painel.treinerit.com.br
        type: string
      publish_release:
        description: Publicar APK na aba GitHub Releases
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'frontend/capacitor.config.json'
      - 'frontend/android/**'
      - 'frontend/src/**'
      - 'portal/src/**'
      - 'scripts/android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            portal/package-lock.json

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref_type != 'tag' }}
          add-job-summary: on-failure

      - name: Instalar dependências (frontend + portal)
        run: |
          npm --prefix frontend ci --ignore-scripts --no-audit --no-fund
          npm --prefix portal ci --ignore-scripts --no-audit --no-fund

      - name: Gerar bundle mobile unificado (Rit Aluno + Rit Painel) e cap sync
        working-directory: frontend
        env:
          VITE_PORTAL_API_BASE: ${{ inputs.api_base || 'https://painel.treinerit.com.br' }}
          VITE_STUDENT_APP_URL: https://app.treinerit.com.br
        run: |
          npm run build:mobile:unified
          test -f android/app/src/main/assets/public/index.html
          test -f android/app/src/main/assets/public/portal/index.html

      - name: Compilar APK Android e rodar testes JVM
        working-directory: frontend/android
        env:
          INPUT_VARIANT: ${{ inputs.variant || 'release' }}
        run: |
          if [ "$INPUT_VARIANT" = "debug" ]; then
            ./gradlew --no-daemon testSideloadDebugUnitTest assembleSideloadDebug
          else
            ./gradlew --no-daemon testSideloadDebugUnitTest assembleSideloadRelease
          fi

      - name: Assinar e preparar APK instalável
        env:
          INPUT_VARIANT: ${{ inputs.variant || 'release' }}
          INPUT_API_BASE: ${{ inputs.api_base || 'https://painel.treinerit.com.br' }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VER="$(node -p "require('./frontend/package.json').version")"
          VARIANT="$INPUT_VARIANT"
          OUT_DIR="$PWD/out"
          mkdir -p "$OUT_DIR"

          if [ "$VARIANT" = "debug" ]; then
            SRC_APK="frontend/android/app/build/outputs/apk/sideload/debug/app-sideload-debug.apk"
            DEST_NAME="Rit-${VER}-debug.apk"
            cp "$SRC_APK" "$OUT_DIR/$DEST_NAME"
            (cd "$OUT_DIR" && sha256sum "$DEST_NAME" > "${DEST_NAME}.sha256")
            SIGNED_MODE="debug-keystore"
          else
            SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
            BT="$(ls -d "$SDK_DIR"/build-tools/* | sort -V | tail -n 1)"
            SRC_APK="frontend/android/app/build/outputs/apk/sideload/release/app-sideload-release-unsigned.apk"
            ALIGNED_APK="/tmp/rit-aligned.apk"
            KS_PATH=""
            trap 'rm -f "$ALIGNED_APK" "$KS_PATH"' EXIT
            "$BT/zipalign" -f -p 4 "$SRC_APK" "$ALIGNED_APK"

            if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ]; then
              KS_PATH="/tmp/rit-release.keystore"
              umask 077
              echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS_PATH"
              KS_PASS="$ANDROID_KEYSTORE_PASSWORD"
              KS_ALIAS="$ANDROID_KEY_ALIAS"
              KEY_PASS="${ANDROID_KEY_PASSWORD:-$KS_PASS}"
              DEST_NAME="Rit-${VER}-release.apk"
              SIGNED_MODE="production-secrets"
            else
              KS_PATH="/tmp/rit-preview.keystore"
              KS_PASS="rit-preview-android"
              KS_ALIAS="rit-preview"
              KEY_PASS="$KS_PASS"
              rm -f "$KS_PATH"
              umask 077
              keytool -genkeypair -v -keystore "$KS_PATH" -storepass "$KS_PASS" -alias "$KS_ALIAS" -keypass "$KEY_PASS" \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Rit, OU=Mobile, O=Rit, L=Sao Paulo, ST=SP, C=BR" >/dev/null 2>&1
              DEST_NAME="Rit-${VER}-preview-signed.apk"
              SIGNED_MODE="preview-keystore"
            fi

            "$BT/apksigner" sign --ks "$KS_PATH" --ks-pass "pass:$KS_PASS" --ks-key-alias "$KS_ALIAS" --key-pass "pass:$KEY_PASS" \
              --out "$OUT_DIR/$DEST_NAME" "$ALIGNED_APK"
            rm -f "$ALIGNED_APK" "$KS_PATH" "$OUT_DIR/${DEST_NAME}.idsig"
            "$BT/apksigner" verify --print-certs "$OUT_DIR/$DEST_NAME"
            (cd "$OUT_DIR" && sha256sum "$DEST_NAME" > "${DEST_NAME}.sha256")
          fi

          {
            echo "### APK Rit gerado com sucesso"
            echo "- Arquivo: \`$DEST_NAME\`"
            echo "- Tamanho: $(numfmt --to=iec "$(stat -c %s "$OUT_DIR/$DEST_NAME")")"
            echo "- Assinatura: \`$SIGNED_MODE\`"
            printf -- '- API do Painel: `%s`\n' "$INPUT_API_BASE"
            echo "- App do Aluno: \`https://app.treinerit.com.br\`"
            if [ "$SIGNED_MODE" = "preview-keystore" ]; then
              echo ""
              echo "> Este APK foi assinado com uma chave temporária de preview (instalável direto no Android). Para atualizações contínuas ou publicação na Google Play, configure os 4 Secrets no repositório: \`ANDROID_KEYSTORE_BASE64\`, \`ANDROID_KEYSTORE_PASSWORD\`, \`ANDROID_KEY_ALIAS\` e \`ANDROID_KEY_PASSWORD\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar artefato do APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rit-android-apk
          path: out/*
          retention-days: 30
          if-no-files-found: error

      - name: Publicar no GitHub Releases
        if: github.ref_type == 'tag' || inputs.publish_release == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ "${{ github.ref_type }}" != "tag" ]; then
            TAG_NAME="apk-v$(node -p "require('./frontend/package.json').version")-${{ github.run_number }}"
          fi
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" out/*.apk out/*.sha256 --clobber
          else
            gh release create "$TAG_NAME" out/*.apk out/*.sha256 \
              --title "Rit Android $TAG_NAME" \
              --notes "APK unificado Rit (App do Aluno + Rit Painel)."
          fi
