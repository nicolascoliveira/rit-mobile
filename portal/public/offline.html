<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Rit Painel — Sem Conexão</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #000000;
        color: #f5f5f7;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .offline-card {
        width: 100%;
        max-width: 440px;
        background: #141416;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 20px;
        padding: 32px 28px;
        text-align: center;
      }
      .offline-logo {
        height: 36px;
        width: auto;
        margin-bottom: 20px;
      }
      .offline-badge {
        display: inline-block;
        padding: 6px 14px;
        border-radius: 999px;
        background: rgba(255, 69, 58, 0.14);
        border: 1px solid rgba(255, 69, 58, 0.35);
        color: #ff6961;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        font-weight: 700;
        line-height: 1.3;
      }
      p {
        margin: 0 0 24px;
        color: #a1a1aa;
        font-size: 16px;
        line-height: 1.55;
      }
      .offline-btn {
        appearance: none;
        width: 100%;
        border: 0;
        border-radius: 12px;
        padding: 14px 20px;
        background: #d0ff00;
        color: #000000;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }
      .offline-btn:active {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <main class="offline-card">
      <img src="/rit-logo.png" alt="Rit" class="offline-logo" />
      <div><span class="offline-badge">Sem conexão com a internet</span></div>
      <h1>Não foi possível carregar o Painel</h1>
      <p>
        Verifique sua conexão Wi-Fi ou dados móveis. Para evitar a exibição de treinos, alunos ou saldos desatualizados,
        o painel requer conexão ativa com o servidor.
      </p>
      <button type="button" class="offline-btn" onclick="window.location.reload()">
        Tentar reconectar
      </button>
    </main>
  </body>
</html>
