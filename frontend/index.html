<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>
  // Set direction before first paint so an Arabic profile never flashes as LTR.
  // The app re-applies this on every language change (lib/i18n.js setLang).
  // i18n-core RTL_LANGS is the runtime source of truth — keep this list in sync.
  try {
    var s = JSON.parse(localStorage.getItem('gym_state_v1') || '{}');
    var l = s.lang || ((navigator.language || '').slice(0, 2) === 'ar' ? 'ar' : 'pt-BR');
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  } catch (e) {}
  // Boot watchdog.
  (function () {
    var shown = false, last = '';
    function fail(title, detail) {
      var b = document.getElementById('boot');
      // Too early for the boot screen (a script in <head>): say it once the page is there.
      if (!b && document.readyState === 'loading') return document.addEventListener('DOMContentLoaded', function () { fail(title, detail); });
      if (shown || !b || b.getAttribute('data-leaving')) return;
      shown = true;
      b.className = 'fail';
      b.removeAttribute('aria-hidden');
      b.setAttribute('role', 'alert');
      b.setAttribute('dir', 'ltr');
      b.innerHTML = '';
      var box = document.createElement('div'), h = document.createElement('p'), p = document.createElement('p');
      h.className = 'h';
      h.textContent = title;
      p.textContent = 'Recarregar a página costuma resolver. Caso persista, envie este código ao suporte:';
      var c = document.createElement('code');
      c.textContent = (detail || 'Tempo limite excedido ao carregar.') + ' (' + navigator.userAgent + ')';
      var r = document.createElement('button');
      r.type = 'button';
      r.textContent = 'Recarregar';
      r.onclick = function () { location.reload(); };
      box.appendChild(h); box.appendChild(p); box.appendChild(c); box.appendChild(r);
      b.appendChild(box);
    }
    window.addEventListener('error', function (e) {
      var t = e && e.target;
      if (t && t.tagName === 'SCRIPT') return fail('O Rit não pôde iniciar neste navegador.', 'Falha ao carregar ' + (t.src || 'script'));
      if (!e || !e.message) return;
      last = e.message + (e.filename ? ' at ' + e.filename.split('/').pop() + ':' + e.lineno : '');
      if (/SyntaxError|Unexpected|Invalid regular expression/i.test(e.message)) fail('O Rit não pôde iniciar neste navegador.', last);
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      if (r) last = String((r && r.message) || r);
    });
    setTimeout(function () {
      fail(last ? 'O Rit não pôde iniciar neste navegador.' : 'O aplicativo está demorando para iniciar.', last);
    }, 10000);
  })();
</script>
<title>Rit</title>
<meta name="description" content="Plataforma inteligente de treinos e evolução física">
<meta name="theme-color" content="#0A0B0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rit">
<!-- use-credentials: browsers fetch the manifest without cookies, even same-origin; behind an auth
     proxy (Authelia, Cloudflare Access, Teleport…) that fetch is a login redirect and the Home Screen
     icon comes out generic. iOS 26 reads the icon from the manifest, so this is where it shows. -->
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
</head>
<body>
<!-- The boot screen: painted with the HTML, before any script runs, forming the official
     Rit "R" mark stroke-by-stroke in Volt Lime (#D0FF00) on #0A0B0D. lib/boot.js removes it
     once the app is ready to paint. -->
<style>
  #boot{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;background:#0A0B0D;transition:opacity .22s ease-out}
  #boot.out{opacity:0;pointer-events:none}
  #boot svg{width:116px;height:auto;overflow:visible}
  #boot .rit-r-anim{transform-box:fill-box;transform-origin:center;animation:rit-breathe 1.25s ease-in-out .75s infinite}
  #boot .r-part{fill:#D0FF00;fill-opacity:0;stroke:#D0FF00;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:102;stroke-dashoffset:102}
  #boot .r-main{animation:rit-draw .52s cubic-bezier(.32,.72,0,1) both,rit-fill .32s ease-out .28s forwards}
  #boot .r-leg{animation:rit-draw .44s cubic-bezier(.32,.72,0,1) .20s both,rit-fill .30s ease-out .38s forwards}
  @keyframes rit-draw{from{stroke-dashoffset:102}to{stroke-dashoffset:0}}
  @keyframes rit-fill{from{fill-opacity:0;stroke-opacity:1}to{fill-opacity:1;stroke-opacity:0}}
  @keyframes rit-breathe{50%{transform:scale(1.035);opacity:.82}}
  #boot.fail{place-items:center;padding:24px}
  #boot.fail div{max-width:340px;font:15px/1.4 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;color:#e6e8ec;text-align:center}
  #boot.fail .h{font-size:19px;font-weight:600;margin:0 0 8px}
  #boot.fail code{display:block;margin:14px 0 18px;padding:10px;border-radius:10px;background:#15171c;color:#a9b0bc;font-size:12px;text-align:left;word-break:break-word;-webkit-user-select:text;user-select:text}
  #boot.fail button{font:inherit;font-weight:600;color:#0A0B0D;background:#D0FF00;border:0;border-radius:999px;min-height:44px;padding:0 28px}
  @media (prefers-reduced-motion:reduce){
    #boot .r-part{animation:none;stroke-dashoffset:0;stroke-opacity:0;fill-opacity:1}
    #boot .rit-r-anim{animation:boot-breathe 1.6s ease-in-out infinite}
    @keyframes boot-breathe{50%{opacity:.55}}
  }
</style>
<div id="boot" aria-hidden="true">
  <svg viewBox="88 152 336 218">
    <g class="rit-r-anim">
      <path class="r-part r-main" pathLength="100" d="M124 210 L164 171 Q168 168 174 168 L353 168 A53.5 53.5 0 0 1 353 275 L242 275 Q235 275 230 280 L179 327 Q175 331 168 331 L103 331 L192 243 Q197 239 205 239 L342 239 A14.5 14.5 0 0 0 342 210 Z"/>
      <path class="r-part r-leg" pathLength="100" d="M240 286 L309 286 L380 354 L317 354 Q311 354 307 350 Z"/>
    </g>
  </svg>
</div>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
